<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card source</title>
<meta name="robots" content="noindex">
<!-- Source for og.png, the 1200x630 link-preview card. Not linked from the site.
     To regenerate after editing, from the repo root:
     python3 -m http.server 8000
     "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" --headless=new --hide-scrollbars \
       --window-size=1200,630 --virtual-time-budget=5000 --screenshot="$PWD/og.png" http://localhost:8000/tools/og-source.html
     (Chrome works the same way.) Then commit og.png. -->
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  background: #14161B; color: #E8E9EC; font-family: Inter, sans-serif;
  display: grid; grid-template-columns: 1fr 430px; align-items: center; gap: 40px;
  padding: 0 72px 0 80px; box-sizing: border-box;
}
.who { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; color: #F1F2F4; margin-bottom: 34px; }
.who i { width: 18px; height: 18px; border-radius: 5px; background: #3FBF8F; }
h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 78px; line-height: 1.02; letter-spacing: -.025em; margin: 0 0 30px; color: #F1F2F4; }
p { margin: 0; font-size: 25px; line-height: 1.45; color: #A4A9B5; }
p b { color: #3FBF8F; font-weight: 600; }
ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: -34px; }
li { aspect-ratio: 1; transform: translateY(var(--y, 0)) rotate(var(--r)); }
li:nth-child(3n+2) { --y: 34px; }
img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: 22%; background: #000;
  box-shadow: 0 18px 30px -14px rgba(0,0,0,.85); outline: 1px solid rgba(255,255,255,.07); outline-offset: -1px; }
</style>
</head>
<body>
<div>
  <div class="who"><i></i>Ahmetcan Gürel</div>
  <h1>I build games that millions of people play.</h1>
  <p>Unity gameplay developer and game designer.<br><b>gurelahmetcan.dev</b></p>
</div>
<ul>
  <li style="--r:-7deg"><img src="../images/gem-stack-icon.jpg" alt=""></li>
  <li style="--r:5deg"><img src="../images/roll-five.svg" alt=""></li>
  <li style="--r:-3deg"><img src="../images/i-want-pizza-icon.jpg" alt=""></li>
  <li style="--r:4deg"><img src="../images/dyno-racing-icon.jpg" alt=""></li>
  <li style="--r:-5deg"><img src="../images/shotle.svg" alt=""></li>
  <li style="--r:8deg"><img src="../images/tap-and-sort-icon.jpg" alt=""></li>
  <li style="--r:-4deg"><img src="../images/voiceplay-icon.jpg" alt=""></li>
  <li style="--r:6deg"><img src="../images/vb-roulette.svg" alt=""></li>
  <li style="--r:-8deg"><img src="../images/the-hand-3d-icon.jpg" alt=""></li>
</ul>
</body>
</html>
